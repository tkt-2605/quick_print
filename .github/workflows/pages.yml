# Builds the customer site and publishes it to GitHub Pages (quickprint.thiruvengadam.me).
# The site talks to the shop PC through the Cloudflare Tunnel at API_BASE.
# Optional repo variables (Settings → Secrets and variables → Actions → Variables):
#   API_BASE     default https://quickprint-api.thiruvengadam.me
#   SITE_DOMAIN  default quickprint.thiruvengadam.me
name: Deploy site

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.API_BASE || 'https://quickprint-api.thiruvengadam.me' }}
      - name: SPA fallback and custom domain
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          echo "${{ vars.SITE_DOMAIN || 'quickprint.thiruvengadam.me' }}" > apps/web/dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
